[project]
name = "tailored-visions-repro"
version = "0.1.0"
description = "Reproduction of 'Tailored Visions: Enhancing Text-to-Image Generation with Personalized Prompt Rewriting' (CVPR 2024)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.57",
    "diffusers>=0.31",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
    "nltk>=3.9",
    "gdown>=5.2",
    "pandas>=2.2",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
api = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailored_visions_repro"]
