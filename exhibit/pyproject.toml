[project]
name = "exhibit"
version = "0.1.0"
description = "Offline FAN preference-aware personalized image exhibition"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pillow>=11"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
 "httpx>=0.28,<1",
 "playwright>=1.58,<2",
 "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exhibit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
