[project]
name = "premier-repro"
version = "0.1.0"
description = "Reproduction of 'Premier: Personalized Preference Modulation with Learnable User Embedding in Text-to-Image Generation' (CVPR 2026)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "diffusers>=0.36",
    "transformers>=4.57",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "optimum-quanto>=0.2.7",
    "prodigyopt>=1.1",
    "lpips>=0.1.4",
    "peft>=0.14",
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "huggingface-hub>=0.26",
    "scipy>=1.13",
    "ninja>=1.13.2",
]

[project.optional-dependencies]
bnb = ["bitsandbytes>=0.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premier"]
